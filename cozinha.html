<body>
<header><svg class="selo" viewBox="0 0 150 150" role="img" aria-label="Medalhão"><defs><linearGradient id="ouroG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3dc86"/><stop offset=".55" stop-color="#d4af37"/><stop offset="1" stop-color="#a98a25"/></linearGradient></defs><circle cx="75" cy="75" r="71" fill="#0b0b0b" stroke="url(#ouroG)" stroke-width="3"/><circle cx="75" cy="75" r="64" fill="none" stroke="#d4af37" stroke-width="1"/><g fill="url(#ouroG)"><path d="M58 47C40 50 27 42 25 19C35 32 46 32 60 35Z"/><path d="M92 47C110 50 123 42 125 19C115 32 104 32 90 35Z"/><path d="M56 48L38 52L45 62L58 57Z"/><path d="M94 48L112 52L105 62L92 57Z"/><path d="M57 35C65 32 85 32 93 35L96 52C96 65 90 73 88 79L88 84C88 90 62 90 62 84L62 79C60 73 54 65 54 52Z"/></g><g fill="#0b0b0b"><ellipse cx="64" cy="53" rx="3.4" ry="2" transform="rotate(18 64 53)"/><ellipse cx="86" cy="53" rx="3.4" ry="2" transform="rotate(-18 86 53)"/><ellipse cx="69" cy="80" rx="2.4" ry="3.4"/><ellipse cx="81" cy="80" rx="2.4" ry="3.4"/></g><path d="M68 41Q75 48 82 41" fill="none" stroke="#0b0b0b" stroke-width="1.6" stroke-linecap="round"/><circle cx="75" cy="88" r="5" fill="none" stroke="#f3dc86" stroke-width="1.8"/><text x="75" y="110" text-anchor="middle" font-family="Rozha One,Georgia,serif" font-size="19" fill="#d4af37">Medalhão</text><text x="75" y="124" text-anchor="middle" font-family="Work Sans,Arial,sans-serif" font-size="6.6" letter-spacing=".9" fill="#d4af37">CHURRASCO NA BRASA</text></svg>
<h1>Cozinha</h1><p id="status"></p><button class="apagar" id="apagar">Apagar histórico de pedidos</button></header>
<div class="comandas" id="pedidos"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="db.js"></script>
<script>
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lista = document.getElementById("pedidos");
DB.ouvir(dados => {
  const ped = Object.entries(dados).sort((a, b) => a[1].status.localeCompare(b[1].status) || a[1].hora - b[1].hora);
  const novos = ped.filter(([, p]) => p.status === "novo").length;
  document.getElementById("status").textContent = novos + " na fila (" + DB.modo + ")";
  document.title = (novos ? "(" + novos + ") " : "") + "Medalhão | Cozinha";
  if (!ped.length) { lista.innerHTML = '<p class="vazio">Nenhum pedido por enquanto. Quando um cliente enviar, a comanda aparece aqui.</p>'; return; }
  lista.innerHTML = ped.map(([id, p]) =>
    '<div class="comanda ' + (p.status === "pronto" ? "feita" : "") + '"><h2>Mesa ' + esc(p.mesa) + '</h2>' +
    '<small>' + new Date(p.hora).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) + (p.tempo ? ' · previsão ' + esc(p.tempo) : '') + '</small>' +
    '<ul>' + p.itens.map(i => '<li>' + i.qtd + 'x ' + esc(i.nome) + '</li>').join("") + '</ul>' +
    (p.obs ? '<p>Obs.: ' + esc(p.obs) + '</p>' : '') +
    (p.status === "novo" ? '<button class="pronto" data-id="' + id + '">Pedido pronto</button>' : '<b>Entregue</b>') + '</div>').join("");
});
document.getElementById("apagar").addEventListener("click", async () => {
  const abertos = document.querySelectorAll(".comanda:not(.feita)").length;
  const aviso = abertos ? "Atenção: ainda há " + abertos + " pedido(s) na fila e eles também serão apagados.\n\n" : "";
  if (confirm(aviso + "Apagar todo o histórico de pedidos? Isso não pode ser desfeito.")) await DB.limpar();
});
lista.addEventListener("click", e => { const b = e.target.closest("[data-id]"); if (b) DB.pronto(b.dataset.id); });
</script>
</body>
</html>
